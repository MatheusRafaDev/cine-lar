<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="mfSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B20" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>
    <linearGradient id="mfBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="50%" stop-color="rgba(229, 9, 20, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>
    <linearGradient id="mfLegLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B20710" />
      <stop offset="100%" stop-color="#5E0004" />
    </linearGradient>
    <linearGradient id="mfLegRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B20710" />
      <stop offset="100%" stop-color="#5E0004" />
    </linearGradient>
    <linearGradient id="mfDiagLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3847" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8F0008" />
    </linearGradient>
    <linearGradient id="mfDiagRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5A" />
      <stop offset="45%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#A8040C" />
    </linearGradient>
    <filter id="mfRibbonDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="mfBackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Red Backlight -->
  <circle cx="50" cy="50" r="28" fill="#E50914" opacity="0.25" filter="url(#mfBackGlow)" />

  <!-- Squircle Base Tile -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#mfSquircleGrad)" stroke="url(#mfBorderGrad)" stroke-width="1.5" />

  <!-- 3D Ribbon 'M' Monogram -->
  <g id="mfRibbonM">
    <!-- Left Stem -->
    <path d="M 21 23 L 34 23 L 34 77 L 21 77 Z" fill="url(#mfLegLeft)" />
    <!-- Right Stem -->
    <path d="M 66 23 L 79 23 L 79 77 L 66 77 Z" fill="url(#mfLegRight)" />
    <!-- Left-to-Center Diagonal Ribbon -->
    <path d="M 21 23 L 34 23 L 56 75 L 43 75 Z" fill="url(#mfDiagLeft)" filter="url(#mfRibbonDropShadow)" />
    <!-- Center-to-Right Diagonal Ribbon (Overlapping Fold with 3D shadow) -->
    <path d="M 79 23 L 66 23 L 44 75 L 57 75 Z" fill="url(#mfDiagRight)" filter="url(#mfRibbonDropShadow)" />
  </g>
</svg>

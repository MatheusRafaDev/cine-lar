<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 46" width="250" height="46" fill="none">
  <defs>
    <linearGradient id="logoSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B20" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="50%" stop-color="rgba(229, 9, 20, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>
    <linearGradient id="logoLegLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B20710" />
      <stop offset="100%" stop-color="#5E0004" />
    </linearGradient>
    <linearGradient id="logoLegRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B20710" />
      <stop offset="100%" stop-color="#5E0004" />
    </linearGradient>
    <linearGradient id="logoDiagLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3847" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8F0008" />
    </linearGradient>
    <linearGradient id="logoDiagRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5A" />
      <stop offset="45%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#A8040C" />
    </linearGradient>
    <linearGradient id="logoFlixTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3847" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <filter id="logoDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Emblem Badge (3D Ribbon M in Squircle) -->
  <g id="logoEmblem">
    <rect x="3" y="3" width="40" height="40" rx="11" fill="url(#logoSquircleGrad)" stroke="url(#logoBorderGrad)" stroke-width="1.2" />
    <g transform="translate(3, 3) scale(0.4)">
      <!-- Left Stem -->
      <path d="M 21 23 L 34 23 L 34 77 L 21 77 Z" fill="url(#logoLegLeft)" />
      <!-- Right Stem -->
      <path d="M 66 23 L 79 23 L 79 77 L 66 77 Z" fill="url(#logoLegRight)" />
      <!-- Left-to-Center Diagonal Ribbon -->
      <path d="M 21 23 L 34 23 L 56 75 L 43 75 Z" fill="url(#logoDiagLeft)" filter="url(#logoDropShadow)" />
      <!-- Center-to-Right Diagonal Ribbon -->
      <path d="M 79 23 L 66 23 L 44 75 L 57 75 Z" fill="url(#logoDiagRight)" filter="url(#logoDropShadow)" />
    </g>
  </g>

  <!-- Typography Wordmark -->
  <text x="54" y="29" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FAF9F5" letter-spacing="2.2">MATHEUS<tspan fill="url(#logoFlixTextGrad)" font-weight="900" letter-spacing="1.5">FLIX</tspan></text>
</svg>
